<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada | Diego Hartwig</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #f6f4ef;
        color: #182422;
        padding: 24px;
      }
      .card { max-width: 440px; text-align: center; }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: #183830;
        color: #f6f4ef;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        margin-bottom: 28px;
      }
      h1 { font-size: 1.75rem; margin: 0 0 12px; }
      p { color: #586763; line-height: 1.6; margin: 0 0 28px; }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #183830;
        color: #f6f4ef;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 20px;
        border-radius: 8px;
      }
      a.button:hover { background: #122e28; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="mark">dh.</span>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi movido. Volte para a página inicial de Diego Hartwig.</p>
      <a class="button" href="/">Voltar ao início</a>
    </div>
  </body>
</html>
